name: 'Build Chocofi crkbd'
on:
  - workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    with:
      keyboard: '["crkbd"]'
      alphas: '["qwerty","colemakdhk"]'
      nav: '["invertedT"]'
      clipboard: '["Win"]'
      
      
      
